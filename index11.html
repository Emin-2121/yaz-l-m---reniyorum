<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D RUNNER: REAL CHARACTER 🥷🔥</title>
    <!-- Three.js ve GLTF Loader Kütüphaneleri -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <style>
        * {
            margin: 0; padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            touch-action: none;
        }

        body {
            background-color: #0b0c10;
            min-height: 100vh;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            overflow: hidden; color: #f0f0f0;
        }

        #game-container {
            position: relative;
            width: 100vw; max-width: 1150px; height: 580px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            border-radius: 12px; overflow: hidden;
            border: 2px solid #45a29e; background: #1f2833;
        }

        canvas { display: block; width: 100%; height: 100%; }

        .overlay-screen {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(11, 12, 16, 0.92);
            backdrop-filter: blur(10px);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 10;
        }

        .main-title {
            font-size: 42px; color: #ff0055;
            letter-spacing: 3px; margin-bottom: 6px;
            font-weight: 900; text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255, 0, 85, 0.6);
        }

        .sub-title { font-size: 14px; color: #66fcf1; margin-bottom: 24px; letter-spacing: 1px; }

        .menu-btn-group { display: flex; flex-direction: column; gap: 10px; width: 240px; }

        .btn {
            padding: 12px 24px;
            background: #ff0055;
            border: none; border-radius: 6px;
            color: #fff; font-size: 15px; font-weight: 700;
            cursor: pointer; transition: all 0.2s ease;
            text-transform: uppercase; letter-spacing: 1px; text-align: center;
        }

        .btn:hover { background: #d90429; transform: translateY(-2px); }

        .btn-secondary { background: #1f2833; color: #66fcf1; border: 1px solid #45a29e; }
        .btn-secondary:hover { background: #45a29e; color: #0b0c10; }

        .hud-panel {
            position: absolute; top: 15px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 15px; font-weight: 800; color: #66fcf1;
            pointer-events: none; z-index: 5;
        }

        .card-container { display: flex; gap: 15px; margin-top: 15px; }

        .upgrade-card {
            width: 180px; height: 210px;
            background: #1f2833;
            border: 2px solid #45a29e; border-radius: 8px;
            padding: 16px; display: flex; flex-direction: column;
            align-items: center; justify-content: space-between;
            cursor: pointer; transition: 0.2s;
        }

        .upgrade-card:hover { transform: translateY(-4px); border-color: #ff0055; background: #0b0c10; }

        .top-controls {
            position: absolute; top: 15px; right: 15px; z-index: 12;
            display: flex; gap: 10px; align-items: center;
        }

        .theme-select, .sound-btn {
            background: #1f2833; border: 1px solid #45a29e;
            border-radius: 6px; color: #66fcf1; padding: 6px 12px;
            cursor: pointer; font-size: 13px; font-weight: 700; outline: none;
        }

        #statusText {
            position: absolute; top: 60px; left: 50%;
            transform: translateX(-50%); font-size: 20px; font-weight: 800;
            color: #ff0055; display: none; z-index: 5; pointer-events: none;
            background: rgba(0,0,0,0.7); padding: 6px 16px; border-radius: 20px;
            border: 1px solid #ff0055;
        }

        .controls-hint { margin-top: 12px; color: #8d99ae; font-size: 13px; text-align: center; }
        .controls-hint b { color: #66fcf1; }
    </style>
</head>
<body>

    <div class="top-controls">
        <select class="theme-select" id="themeSelector" onchange="changeTheme(this.value)">
            <option value="volcano">🌋 Lav & Cehennem Vadisi</option>
            <option value="night">🌙 Karanlık Gece & Ay Işığı</option>
            <option value="forest">🌲 Zehirli Sisli Orman</option>
            <option value="desert">🏜️ Altın Çöl Fırtınası</option>
        </select>
        <button class="sound-btn" onclick="toggleMute()" id="muteBtn">🔊 SES AÇIK</button>
    </div>

    <div id="game-container">
        <div id="statusText">⚡ KIL PAYI TEĞET GEÇTİN!</div>

        <div id="hudPanel" class="hud-panel" style="display: none;">
            <div>CAN: <span id="hpDisplay" style="letter-spacing: 2px;">❤️❤️❤️</span></div>
            <div>SKOR: <span id="scoreDisplay" style="color:#fff;">0</span> (REKOR: <span id="highScoreDisplay" style="color:#66fcf1;">0</span>)</div>
            <div>COIN: 🪙 <span id="coinDisplay" style="color:#ffd700;">0</span></div>
        </div>

        <div id="mainMenu" class="overlay-screen">
            <h1 class="main-title">3D RUNNER 🥷</h1>
            <p class="sub-title">GERÇEK 3D MODEL & HARDCORE ENGELLER ⚔️</p>
            <div class="menu-btn-group">
                <button class="btn" onclick="startGame()">OYUNA BAŞLA</button>
            </div>
        </div>

        <div id="cardSelectMenu" class="overlay-screen" style="display: none;">
            <h2 style="color:#66fcf1; font-size:24px; margin-bottom: 4px;">GÜÇLENDİRME SEÇ</h2>
            <p style="color:#c5c6c7; font-size:13px;">Hayatta kalmak için kart seç:</p>
            <div class="card-container" id="cardOptions"></div>
        </div>

        <div id="gameOverScreen" class="overlay-screen" style="display: none;">
            <h1 class="main-title" style="color:#ff0055;">ELENDİN! 💥</h1>
            <p id="finalScoreText" class="sub-title">Skorun: 0</p>
            <div class="menu-btn-group">
                <button class="btn" onclick="startGame()">TEKRAR DENE</button>
                <button class="btn btn-secondary" onclick="quitToMainMenu()">ANA MENÜ</button>
            </div>
        </div>

        <div id="canvas3d"></div>
    </div>

    <div class="controls-hint">
        🎮 <b>Yön:</b> A / D veya Kaydır | <b>Zıpla:</b> SPACE | ⚔️ <b>Ateş:</b> Sol Tık / Dokun
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let isMuted = false;

        function playSound(freq, type, duration) {
            if (isMuted) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function toggleMute() {
            isMuted = !isMuted;
            document.getElementById('muteBtn').textContent = isMuted ? '🔇 SES SESSİZ' : '🔊 SES AÇIK';
        }

        let totalCoins = parseInt(localStorage.getItem('ninja_coins')) || 0;
        let highScore = parseInt(localStorage.getItem('ninja_highscore')) || 0;

        function saveGame() {
            localStorage.setItem('ninja_coins', totalCoins);
            localStorage.setItem('ninja_highscore', highScore);
        }

        let isPlaying = false;
        let isPaused = false;
        let hp = 3;
        let score = 0;
        let gameSpeed = 1.05;
        let targetPosX = 0;

        let laserPass = false;
        let explosiveShot = false;
        let nextCardScore = 1500;
        let shakeIntensity = 0;
        let lastShootTime = 0;

        // 3D SAHNE & ATMOSFER
        const container = document.getElementById('canvas3d');
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x1a0505, 30, 140);

        const camera = new THREE.PerspectiveCamera(55, 1150 / 580, 0.1, 1000);
        camera.position.set(0, 3.8, 8.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(1150, 580);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const clock = new THREE.Clock();

        // IŞIKLAR
        const dirLight = new THREE.DirectionalLight(0xff5533, 1.4);
        dirLight.position.set(25, 45, 20);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x222222, 0.6);
        scene.add(hemiLight);

        // Zemin
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x180b0b, roughness: 0.8 });
        const road = new THREE.Mesh(new THREE.PlaneGeometry(14, 1000), roadMat);
        road.rotation.x = -Math.PI / 2;
        road.position.set(0, 0, -450);
        road.receiveShadow = true;
        scene.add(road);

        // Sütunlar
        let pillars = [];
        const pillarGeo = new THREE.BoxGeometry(1.6, 7, 1.6);
        const pillarMat = new THREE.MeshStandardMaterial({ color: 0x4a0e0e, roughness: 0.7 });
        for (let i = 0; i < 20; i++) {
            const pLeft = new THREE.Mesh(pillarGeo, pillarMat);
            const pRight = new THREE.Mesh(pillarGeo, pillarMat);
            pLeft.position.set(-8.5, 3.5, -i * 30);
            pRight.position.set(8.5, 3.5, -i * 30);
            pLeft.castShadow = true; pRight.castShadow = true;
            scene.add(pLeft); scene.add(pRight);
            pillars.push(pLeft, pRight);
        }

        // TEMA MOTORU
        const themePresets = {
            volcano: { sky: 0x1a0505, light: 0xff3300, road: 0x180b0b, pillar: 0x4a0e0e },
            night:   { sky: 0x050b14, light: 0x66fcf1, road: 0x0c131d, pillar: 0x1f2833 },
            forest:  { sky: 0x071a11, light: 0x70e000, road: 0x0b1a0e, pillar: 0x1b4332 },
            desert:  { sky: 0x2b1704, light: 0xffb703, road: 0x221303, pillar: 0x7f4f24 }
        };

        function changeTheme(themeKey) {
            const t = themePresets[themeKey] || themePresets.volcano;
            scene.background = new THREE.Color(t.sky);
            scene.fog.color = new THREE.Color(t.sky);
            dirLight.color.setHex(t.light);
            roadMat.color.setHex(t.road);
            roadMat.needsUpdate = true;
            pillarMat.color.setHex(t.pillar);
            pillarMat.needsUpdate = true;
        }
        changeTheme('volcano');

        // --- HARİCİ 3D MODEL & ANİMASYON ENTEGRASYONU ---
        const playerGroup = new THREE.Group();
        scene.add(playerGroup);

        let mixer;
        let actions = {};
        let activeAction;

        // Three.js Resmi CDN üzerinden yüklenen animasyonlu model (RobotExpressive)
        const loader = new THREE.GLTFLoader();
        loader.load(
            'https://threejs.org/examples/models/gltf/RobotExpressive/RobotExpressive.glb',
            (gltf) => {
                const model = gltf.scene;
                model.scale.set(0.35, 0.35, 0.35);
                model.rotation.y = Math.PI; // Kameraya sırtını dönsün (ileri baksın)
                model.traverse((child) => {
                    if (child.isMesh) child.castShadow = true;
                });
                playerGroup.add(model);

                mixer = new THREE.AnimationMixer(model);
                gltf.animations.forEach((clip) => {
                    actions[clip.name.toLowerCase()] = mixer.clipAction(clip);
                });

                // Koşma animasyonunu başlat
                if (actions['running']) {
                    activeAction = actions['running'];
                    activeAction.play();
                } else if (gltf.animations[0]) {
                    activeAction = mixer.clipAction(gltf.animations[0]);
                    activeAction.play();
                }
            },
            undefined,
            (error) => { console.error('Model yüklenemedi:', error); }
        );

        function setCharacterAnimation(name) {
            if (!mixer || !actions[name] || activeAction === actions[name]) return;
            const prevAction = activeAction;
            activeAction = actions[name];
            if (prevAction) prevAction.fadeOut(0.15);
            activeAction.reset().fadeIn(0.15).play();
        }

        let playerVelY = 0;
        let isGrounded = true;
        const gravity = -0.028;

        let obstacles3D = [];
        let coins3D = [];
        let bullets3D = [];
        let debris = [];

        function addDebris(pos, color = 0x555555) {
            for (let i = 0; i < 8; i++) {
                const p = new THREE.Mesh(
                    new THREE.BoxGeometry(0.25, 0.25, 0.25),
                    new THREE.MeshStandardMaterial({ color: color, roughness: 0.8 })
                );
                p.position.copy(pos);
                p.userData = {
                    vel: new THREE.Vector3((Math.random()-0.5)*0.5, Math.random()*0.4+0.2, (Math.random()-0.5)*0.5),
                    rot: new THREE.Vector3(Math.random()*0.1, Math.random()*0.1, 0),
                    life: 25
                };
                scene.add(p); debris.push(p);
            }
        }

        function triggerShake(intensity = 0.4) { shakeIntensity = intensity; }
        function moveLeft() { if (targetPosX > -4.5 && isPlaying && !isPaused) targetPosX -= 4.5; }
        function moveRight() { if (targetPosX < 4.5 && isPlaying && !isPaused) targetPosX += 4.5; }

        function doJump() {
            if (isGrounded && isPlaying && !isPaused) {
                playerVelY = 0.56;
                isGrounded = false;
                setCharacterAnimation('jump');
                playSound(320, 'triangle', 0.12);
            }
        }

        function doShoot() {
            const now = Date.now();
            if (isPlaying && !isPaused && now - lastShootTime > 300) {
                lastShootTime = now;
                playSound(650, 'square', 0.06);
                const bullet = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 1, 8), new THREE.MeshStandardMaterial({ color: 0xff0055 }));
                bullet.rotation.x = Math.PI / 2;
                bullet.position.set(playerGroup.position.x, playerGroup.position.y + 0.9, playerGroup.position.z - 1);
                scene.add(bullet); bullets3D.push(bullet);
            }
        }

        window.addEventListener('keydown', (e) => {
            if (!isPlaying || isPaused) return;
            if (e.code === 'KeyA' || e.code === 'ArrowLeft') moveLeft();
            if (e.code === 'KeyD' || e.code === 'ArrowRight') moveRight();
            if (e.code === 'Space') doJump();
        });

        window.addEventListener('mousedown', (e) => {
            if (e.button === 0 && isPlaying && !isPaused) doShoot();
        });

        let touchStartX = 0, touchStartY = 0;
        window.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY;
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
            if (!isPlaying || isPaused) return;
            let diffX = e.changedTouches[0].clientX - touchStartX;
            let diffY = e.changedTouches[0].clientY - touchStartY;
            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 35) moveRight(); else if (diffX < -35) moveLeft();
            } else {
                if (diffY < -35) doJump(); else doShoot();
            }
        });

        function updateUI() {
            document.getElementById('coinDisplay').textContent = totalCoins;
            document.getElementById('scoreDisplay').textContent = score;
            document.getElementById('highScoreDisplay').textContent = highScore;
            document.getElementById('hpDisplay').textContent = '❤️'.repeat(Math.max(0, hp));
        }

        function showStatus(text) {
            const st = document.getElementById('statusText');
            st.textContent = text; st.style.display = 'block';
            setTimeout(() => { st.style.display = 'none'; }, 1500);
        }

        function triggerCardSelect() {
            isPaused = true;
            const cardCont = document.getElementById('cardOptions');
            cardCont.innerHTML = `
                <div class="upgrade-card" onclick="selectCard('laser')">
                    <h3 style="color:#66fcf1;">⚡ Delici Ok</h3>
                    <p style="font-size:12px; text-align:center; color:#ddd;">Mermiler tüm engelleri deler.</p>
                </div>
                <div class="upgrade-card" onclick="selectCard('bomb')">
                    <h3 style="color:#ff0055;">💥 Alan Patlaması</h3>
                    <p style="font-size:12px; text-align:center; color:#ddd;">Vurulan engel tüm alanı temizler.</p>
                </div>
                <div class="upgrade-card" onclick="selectCard('heal')">
                    <h3 style="color:#ffd700;">❤️ Can Doldur</h3>
                    <p style="font-size:12px; text-align:center; color:#ddd;">Canı tekrar 3'e tamamlar.</p>
                </div>
            `;
            document.getElementById('cardSelectMenu').style.display = 'flex';
        }

        function selectCard(type) {
            if (type === 'laser') laserPass = true;
            if (type === 'bomb') explosiveShot = true;
            if (type === 'heal') hp = 3;
            document.getElementById('cardSelectMenu').style.display = 'none';
            isPaused = false; updateUI();
        }

        function startGame() {
            document.querySelectorAll('.overlay-screen').forEach(s => s.style.display = 'none');
            document.getElementById('hudPanel').style.display = 'flex';
            isPlaying = true; isPaused = false;
            hp = 3; score = 0; gameSpeed = 1.05; nextCardScore = 1500;
            laserPass = false; explosiveShot = false; resetGame();
            setCharacterAnimation('running');
        }

        function quitToMainMenu() {
            isPlaying = false; isPaused = false;
            document.querySelectorAll('.overlay-screen').forEach(s => s.style.display = 'none');
            document.getElementById('hudPanel').style.display = 'none';
            document.getElementById('mainMenu').style.display = 'flex';
            resetGame();
        }

        function resetGame() {
            playerGroup.position.set(0, 0, 0); targetPosX = 0; playerVelY = 0;
            obstacles3D.forEach(o => scene.remove(o));
            coins3D.forEach(c => scene.remove(c));
            bullets3D.forEach(b => scene.remove(b));
            debris.forEach(p => scene.remove(p));
            obstacles3D = []; coins3D = []; bullets3D = []; debris = [];
            updateUI();
        }

        function spawnObstacle() {
            if (!isPlaying || isPaused) return;
            const lanes = [-4.5, 0, 4.5];
            const laneIndex = Math.floor(Math.random() * lanes.length);
            const posX = lanes[laneIndex];
            const obstacleType = Math.floor(Math.random() * 4);

            let obs;
            if (obstacleType === 0) {
                const geo = new THREE.CylinderGeometry(1.2, 1.2, 0.3, 16);
                const mat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.8 });
                obs = new THREE.Mesh(geo, mat);
                obs.position.set(posX, 1.2, -140);
                obs.rotation.x = Math.PI / 2;
                obs.userData = { type: 'saw', moveX: (Math.random() > 0.5 ? 0.05 : -0.05) };
            } else if (obstacleType === 1) {
                const geo = new THREE.DodecahedronGeometry(1.1);
                const mat = new THREE.MeshStandardMaterial({ color: 0xff0055, roughness: 0.5 });
                obs = new THREE.Mesh(geo, mat);
                obs.position.set(posX, 2.6, -140);
                obs.userData = { type: 'drone' };
            } else if (obstacleType === 2) {
                const geo = new THREE.ConeGeometry(1.2, 2.2, 6);
                const mat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });
                obs = new THREE.Mesh(geo, mat);
                obs.position.set(posX, 1.1, -140);
                obs.userData = { type: 'spike' };
            } else {
                const geo = new THREE.BoxGeometry(6, 1.2, 1.2);
                const mat = new THREE.MeshStandardMaterial({ color: 0x4a2810, roughness: 0.9 });
                obs = new THREE.Mesh(geo, mat);
                obs.position.set(laneIndex === 0 ? -2.25 : 2.25, 1.2, -140);
                obs.userData = { type: 'wide_barricade' };
            }

            obs.castShadow = true; scene.add(obs); obstacles3D.push(obs);
        }

        function spawnCoin() {
            if (!isPlaying || isPaused) return;
            const coin = new THREE.Mesh(
                new THREE.CylinderGeometry(0.55, 0.55, 0.1, 16),
                new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.9, roughness: 0.2 })
            );
            coin.rotation.x = Math.PI / 2;
            const lanes = [-4.5, 0, 4.5];
            coin.position.set(lanes[Math.floor(Math.random() * lanes.length)], 1.1, -140);
            scene.add(coin); coins3D.push(coin);
        }

        let frame = 0;

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            if (mixer) mixer.update(delta); // 3D Karakter kemik animasyonunu ilerlet

            if (isPlaying && !isPaused) {
                frame++; score += 1;
                if (frame % 150 === 0) gameSpeed += 0.035;

                pillars.forEach(p => {
                    p.position.z += gameSpeed;
                    if (p.position.z > 20) p.position.z -= 600;
                });

                if (score >= nextCardScore) {
                    triggerCardSelect(); nextCardScore += 2000;
                }

                // Sağa-Sola Yatış Fiziği
                const moveSpeedX = (targetPosX - playerGroup.position.x);
                playerGroup.position.x += moveSpeedX * 0.22;
                playerGroup.rotation.z = -moveSpeedX * 0.08;
                
                playerGroup.position.y += playerVelY;
                playerVelY += gravity;

                if (playerGroup.position.y <= 0) {
                    playerGroup.position.y = 0;
                    playerVelY = 0;
                    if (!isGrounded) {
                        isGrounded = true;
                        setCharacterAnimation('running');
                    }
                }

                if (frame % 32 === 0) spawnObstacle();
                if (frame % 45 === 0) spawnCoin();

                // Parça Efektleri
                for (let pIdx = debris.length - 1; pIdx >= 0; pIdx--) {
                    const p = debris[pIdx];
                    p.position.add(p.userData.vel);
                    p.rotation.x += p.userData.rot.x;
                    p.userData.vel.y -= 0.015;
                    p.userData.life--;
                    if (p.userData.life <= 0) { scene.remove(p); debris.splice(pIdx, 1); }
                }

                // Altınlar
                for (let c = coins3D.length - 1; c >= 0; c--) {
                    const coin = coins3D[c];
                    coin.position.z += gameSpeed; coin.rotation.z += 0.05;

                    if (coin.position.distanceTo(playerGroup.position) < 1.6) {
                        playSound(880, 'sine', 0.08);
                        addDebris(coin.position, 0xffd700);
                        totalCoins += 10; score += 30; saveGame(); updateUI();
                        scene.remove(coin); coins3D.splice(c, 1);
                        continue;
                    }
                    if (coin.position.z > 10) { scene.remove(coin); coins3D.splice(c, 1); }
                }

                // Mermiler
                for (let b = bullets3D.length - 1; b >= 0; b--) {
                    const bullet = bullets3D[b];
                    bullet.position.z -= 3.0;

                    for (let o = obstacles3D.length - 1; o >= 0; o--) {
                        if (bullet.position.distanceTo(obstacles3D[o].position) < 2.2) {
                            playSound(180, 'triangle', 0.12);
                            addDebris(obstacles3D[o].position, 0xff0055);
                            
                            if (explosiveShot) {
                                triggerShake(0.4);
                                const hitPos = obstacles3D[o].position.clone();
                                for (let extraIdx = obstacles3D.length - 1; extraIdx >= 0; extraIdx--) {
                                    if (obstacles3D[extraIdx] && obstacles3D[extraIdx].position.distanceTo(hitPos) < 7) {
                                        addDebris(obstacles3D[extraIdx].position, 0x888888);
                                        scene.remove(obstacles3D[extraIdx]);
                                        obstacles3D.splice(extraIdx, 1);
                                        score += 50;
                                    }
                                }
                            } else {
                                scene.remove(obstacles3D[o]);
                                obstacles3D.splice(o, 1);
                            }

                            if (!laserPass) { scene.remove(bullet); bullets3D.splice(b, 1); }
                            totalCoins += 10; score += 50; saveGame(); updateUI();
                            break;
                        }
                    }

                    if (bullets3D[b] && bullets3D[b].position.z < -150) {
                        scene.remove(bullets3D[b]); bullets3D.splice(b, 1);
                    }
                }

                // Engeller
                for (let i = obstacles3D.length - 1; i >= 0; i--) {
                    const obs = obstacles3D[i];
                    obs.position.z += gameSpeed;

                    if (obs.userData.moveX) {
                        obs.position.x += obs.userData.moveX;
                        if (obs.position.x > 4.5 || obs.position.x < -4.5) obs.userData.moveX *= -1;
                    }

                    if (obs.userData.type === 'saw') obs.rotation.z += 0.15;
                    if (obs.userData.type === 'drone') obs.rotation.y += 0.05;

                    const dist = obs.position.distanceTo(playerGroup.position);

                    if (dist > 1.6 && dist < 2.4 && !obs.userData.nearMissed) {
                        obs.userData.nearMissed = true;
                        score += 100;
                        showStatus("⚡ KIL PAYI TEĞET GEÇTİN (+100)!");
                        playSound(950, 'sine', 0.08);
                    }

                    if (dist < 1.5) {
                        playSound(100, 'sawtooth', 0.3);
                        triggerShake(0.55);
                        addDebris(playerGroup.position, 0xff0055);
                        hp--; updateUI();

                        if (hp <= 0) {
                            isPlaying = false;
                            setCharacterAnimation('death');
                            if (score > highScore) highScore = score;
                            saveGame();
                            document.getElementById('finalScoreText').textContent = `Skorun: ${score} (Rekor: ${highScore})`;
                            document.getElementById('gameOverScreen').style.display = 'flex';
                        }

                        scene.remove(obs); obstacles3D.splice(i, 1);
                    }

                    if (obstacles3D[i] && obstacles3D[i].position.z > 10) {
                        scene.remove(obstacles3D[i]); obstacles3D.splice(i, 1);
                    }
                }

                updateUI();
            }

            let shakeX = (Math.random() - 0.5) * shakeIntensity;
            let shakeY = (Math.random() - 0.5) * shakeIntensity;
            shakeIntensity *= 0.86;

            camera.position.x = (playerGroup.position.x * 0.25) + shakeX;
            camera.position.y = 3.8 + shakeY;
            camera.lookAt(playerGroup.position.x * 0.25, playerGroup.position.y + 0.8, playerGroup.position.z - 12);

            renderer.render(scene, camera);
        }

        updateUI();
        animate();
    </script>
</body>
</html>
